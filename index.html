<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELITE CODES | START.IO</title>
    
    <script src="https://sdk.start.io/node/start.js"></script>
    <script>
        // استبدل الرقم التالي بـ App ID الذي حصلت عليه من Start.io
        const STARTIO_APP_ID = "2XXXXXXXX"; 
        startio.init(STARTIO_APP_ID);
    </script>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        :root { --main: #3b82f6; --gold: #fbbf24; --bg: #020617; --card: #111827; --glass: rgba(17, 24, 39, 0.8); }
        
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: #f8fafc; margin: 0; padding-bottom: 110px; min-height: 100vh; overflow-x: hidden; }
        header { background: var(--glass); backdrop-filter: blur(15px); padding: 15px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 24px; font-weight: 900; } .logo span { color: var(--main); }
        
        .status-bar { margin: 12px; padding: 12px; background: rgba(59,130,246,0.1); border-radius: 15px; border: 1px solid rgba(59,130,246,0.2); display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .id-val { color: var(--gold); font-family: monospace; background: #000; padding: 2px 8px; border-radius: 5px; cursor: pointer; }
        
        .tab-content { display: none; padding: 12px; animation: slideIn 0.3s ease-out; }
        .tab-content.active { display: block; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        
        /* إعلانات Start.io Banner */
        .ad-container { margin: 10px 0; text-align: center; min-height: 50px; background: rgba(255,255,255,0.02); border-radius: 10px; }

        .card { background: var(--card); border-radius: 20px; padding: 18px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); position: relative; }
        .vip-card { border: 1px solid rgba(251, 191, 36, 0.3); background: linear-gradient(145deg, #111827, #020617); }
        .vip-tag { position: absolute; top: 10px; left: 10px; background: var(--gold); color: #000; font-size: 10px; font-weight: 900; padding: 2px 8px; border-radius: 5px; }

        .league-name { font-size: 11px; font-weight: 700; color: var(--main); text-transform: uppercase; display: block; margin-bottom: 5px; }
        .code-display { background: #000; margin: 10px 0; padding: 15px; border-radius: 12px; text-align: center; font-size: 24px; font-weight: 900; letter-spacing: 2px; border: 1px dashed rgba(255,255,255,0.2); }
        .blur { filter: blur(12px); opacity: 0.3; pointer-events: none; }
        
        .btn { background: var(--main); color: white; border: none; padding: 12px; border-radius: 12px; font-weight: 800; width: 100%; cursor: pointer; font-family: inherit; transition: 0.2s; }
        .btn-gold { background: var(--gold); color: #000; box-shadow: 0 4px 15px rgba(251, 191, 36, 0.2); }
        
        nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--glass); backdrop-filter: blur(20px); display: flex; padding: 10px 0; border-top: 1px solid rgba(255,255,255,0.05); z-index: 1000; }
        .nav-item { flex: 1; text-align: center; color: #64748b; cursor: pointer; font-size: 11px; }
        .nav-item.active { color: var(--main); }
        .nav-item i { font-size: 18px; display: block; margin-bottom: 3px; }
        
        #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--main); color: white; padding: 10px 25px; border-radius: 30px; font-size: 14px; font-weight: 700; display: none; z-index: 2000; }
    </style>
</head>
<body>

    <div id="toast"></div>

    <header><div class="logo">ELITE <span>CODES</span></div></header>

    <div class="ad-container" id="top-ad"></div>

    <div class="status-bar">
        <div>ID: <span class="id-val" id="uId" onclick="copyId()">....</span></div>
        <div id="vStatus"></div>
    </div>

    <div id="home" class="tab-content active">
        <div id="free-list"></div>
    </div>
    
    <div id="vip" class="tab-content">
        <div id="vip-locked" style="text-align:center; padding:50px 20px; display:none;">
            <i class="fas fa-crown" style="font-size: 40px; color: var(--gold); margin-bottom: 10px;"></i>
            <h3>باقة النخبة VIP</h3>
            <button class="btn btn-gold" onclick="switchTab('pricing')">اشترك لفتح التوقعات</button>
        </div>
        <div id="vip-list"></div>
    </div>

    <div id="pricing" class="tab-content">
        <h3 style="text-align:center;">💎 خطط الاشتراك</h3>
        <div style="background:var(--card); padding:15px; border-radius:15px; margin-bottom:10px; border:1px solid rgba(59,130,246,0.3)" onclick="contact('أسبوعي','100')">
            <b>باقة 7 أيام</b> <span style="float:left; color:var(--gold)">100 ج.م</span>
        </div>
        <div style="background:var(--card); padding:15px; border-radius:15px; margin-bottom:10px; border:2px solid var(--main)" onclick="contact('شهري','300')">
            <b>الباقة الشهرية 🏆</b> <span style="float:left; color:var(--gold)">300 ج.م</span>
        </div>
        <div style="background:var(--card); padding:15px; border-radius:15px; margin-bottom:10px;" onclick="contact('3 شهور','750')">
            <b>باقة 3 شهور 🔥</b> <span style="float:left; color:var(--gold)">750 ج.م</span>
        </div>
    </div>

    <nav>
        <div class="nav-item active" onclick="switchTab('home', this)"><i class="fas fa-futbol"></i><span>عام</span></div>
        <div class="nav-item" onclick="switchTab('vip', this)"><i class="fas fa-crown"></i><span>VIP</span></div>
        <div class="nav-item" onclick="switchTab('pricing', this)"><i class="fas fa-gem"></i><span>الأسعار</span></div>
    </nav>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyBFNs-ZY0EGy9yz18VBnf8QGn4zs4W0fM8", databaseURL: "https://fyydf-47201-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myId = localStorage.getItem('elite_uid') || ('EL-' + Math.random().toString(36).substr(2, 6).toUpperCase());
        localStorage.setItem('elite_uid', myId);
        document.getElementById('uId').innerText = myId;

        function showToast(m) {
            const t = document.getElementById('toast'); t.innerText = m; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2000);
        }

        function switchTab(id, el = null) {
            const isLocked = document.getElementById('vip-locked').style.display === 'block';
            if(id === 'vip' && isLocked) { id = 'pricing'; showToast("🔒 خاص بالمشتركين"); }
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(el) el.classList.add('active');
        }

        db.ref('vip_users/' + myId).on('value', s => {
            const d = s.val();
            const isVip = d && d.active && Date.now() < d.expire;
            document.getElementById('vStatus').innerHTML = isVip ? `<b style="color:#22c55e">VIP نشط</b>` : `<b>GUEST</b>`;
            document.getElementById('vip-locked').style.display = isVip ? 'none' : 'block';
            load(isVip);
        });

        function load(isVip) {
            db.ref('free_codes').on('value', snap => {
                const div = document.getElementById('free-list'); div.innerHTML = "";
                snap.forEach(c => div.innerHTML += renderCard(c.val(), true, false));
            });
            if(isVip) {
                db.ref('vip_codes').on('value', snap => {
                    const div = document.getElementById('vip-list'); div.innerHTML = "";
                    snap.forEach(c => div.innerHTML += renderCard(c.val(), true, true));
                });
            } else {
                db.ref('vip_codes').limitToLast(1).once('value', snap => {
                    const div = document.getElementById('vip-list'); div.innerHTML = "";
                    snap.forEach(c => div.innerHTML += renderCard(c.val(), false, true));
                });
            }
        }

        function renderCard(d, show, isVip) {
            return `<div class="card ${isVip?'vip-card':''}">
                ${isVip ? '<span class="vip-tag">VIP</span>' : ''}
                <span class="league-name">${d.league}</span>
                <div class="code-display ${show?'':'blur'}">${show?d.code:'XXXXXX'}</div>
                <button class="btn ${isVip?'btn-gold':''}" onclick="handleAction('${d.code}', ${show})">
                    ${show ? 'نسخ القسيمة' : 'فتح كود الـ VIP'}
                </button>
            </div>`;
        }

        function handleAction(c, show) {
            if(!show) { switchTab('pricing'); return; }
            
            // --- إعلان Start.io Interstitial عند النسخ ---
            if (typeof startio !== 'undefined') {
                startio.showInterstitial(); 
            }

            navigator.clipboard.writeText(c);
            showToast("✅ تم نسخ الكود");
        }

        function copyId() { navigator.clipboard.writeText(myId); showToast("🆔 تم نسخ المعرف"); }
        function contact(p, s) { window.open(`https://t.me/MaMA6d?text=${encodeURIComponent('اشتراك '+p+'\nID: '+myId)}`); }

        // تسجيل الـ Service Worker للموقع ليعمل كتطبيق
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
    </script>
</body>
</html>
